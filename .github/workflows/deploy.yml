name: Publicar no GitHub Pages

# Publica a cada push na main, e também sob demanda pelo botão
# "Run workflow" na aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões exigidas pelo deploy oficial do Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Se dois pushes acontecerem seguidos, o segundo espera o primeiro terminar
# em vez de os dois disputarem a publicação.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # O site é estático: não há build. Sobe a raiz do repositório como está.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
